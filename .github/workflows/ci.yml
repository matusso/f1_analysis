name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Sync environment
        run: uv sync --frozen --extra grafana --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Verify requirements.txt is in sync with the lockfile
        run: |
          uv export --no-hashes --no-dev --format requirements-txt -o requirements.check.txt
          diff -u requirements.txt requirements.check.txt
